<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I climbed a mountain to ask you something</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --sky-top:#1d1238;--sky-mid:#7a2f6b;--sky-low:#ff9a62;
  --card:#fff6e4;--ink:#2a1840;--pink:#ff4f8b;--pink-ink:#ffffff;--stone:#d8ccb8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky-top:#0f0824;--sky-mid:#5a2160;--sky-low:#d9744a;--card:#2a1840;--ink:#fff1dc;--pink:#ff5c93;--pink-ink:#2a1840;--stone:#4a3a60}
}
:root[data-theme="dark"]{--sky-top:#0f0824;--sky-mid:#5a2160;--sky-low:#d9744a;--card:#2a1840;--ink:#fff1dc;--pink:#ff5c93;--pink-ink:#2a1840;--stone:#4a3a60}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;overflow-x:hidden;color:var(--ink);
  font-family:"VT323","Courier New",monospace;font-size:22px;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 94%);}
.stage{position:relative;width:min(100%,calc(100svh * .5714));margin:0 auto}
svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.card{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);width:88%;max-width:390px;
  background:var(--card);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 14px 14px;text-align:center}
.label{margin:0;font:11px/1.5 "Press Start 2P","Courier New",monospace}
.alt{margin:8px 0 6px;font:16px/1.2 "Press Start 2P","Courier New",monospace;color:var(--pink)}
.bar{height:12px;border:3px solid var(--ink);background:var(--stone)}
.bar i{display:block;height:100%;width:0;background:var(--pink)}
h1{margin:0;font:13px/1.55 "Press Start 2P","Courier New",monospace}
.sub{margin:8px 0 10px;min-height:1.1em;line-height:1}
.btns{display:flex;gap:14px;justify-content:center;align-items:center}
button{font:12px/1 "Press Start 2P","Courier New",monospace;color:var(--ink);background:var(--stone);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:11px 16px;cursor:pointer;border-radius:0}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
#yes{background:var(--pink);color:var(--pink-ink);transition:transform .15s}
#no{transition:transform .15s}
.card [hidden]{display:none}
.reveal{animation:pop .25s steps(4)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes legA{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes legB{0%,100%{transform:translateY(-2px)}50%{transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.walking .legL,.walking .armR{animation:legA .4s steps(1) infinite}
.walking .legR,.walking .armL{animation:legB .4s steps(1) infinite}
.cheer #hop{animation:hop .6s ease-out infinite}
.heart{position:fixed;bottom:-30px;color:var(--pink);pointer-events:none;animation:rise linear forwards;z-index:5}
@keyframes rise{to{transform:translateY(-110vh) rotate(18deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.walking *,.cheer #hop,.reveal{animation:none!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
<svg viewBox="0 0 400 700" role="img" aria-label="A pixel explorer climbs a snow-capped mountain toward a flag on the summit">
  <g id="stars" fill="#fff" opacity=".8"></g>
  <g fill="#ffe27a"><rect x="320" y="290" width="30" height="10"/><rect x="310" y="300" width="50" height="30"/><rect x="320" y="330" width="30" height="10"/></g>
  <g fill="#fff" opacity=".85">
    <rect x="20" y="200" width="50" height="10"/><rect x="30" y="190" width="30" height="10"/>
    <rect x="290" y="170" width="60" height="10"/><rect x="300" y="160" width="30" height="10"/>
  </g>
  <g id="mtn"></g>
  <path id="trail" fill="none" stroke="#f3d9a0" stroke-width="4" stroke-dasharray="8 6" opacity=".9"/>
  <g id="trees">
    <g fill="#5a3b1e"><rect x="346" y="636" width="4" height="24"/><rect x="14" y="644" width="4" height="20"/></g>
    <g fill="#1f5a2c"><rect x="326" y="628" width="44" height="8"/><rect x="334" y="622" width="28" height="6"/><rect x="0" y="636" width="36" height="8"/><rect x="6" y="630" width="24" height="6"/></g>
  </g>
  <g id="flag"><rect x="246" y="226" width="3" height="34" fill="#5a3b1e"/><rect x="249" y="226" width="22" height="14" fill="#ff4f8b"/></g>
  <g id="hero">
    <g id="hop">
      <g id="heart" fill="#ff4f8b" display="none"></g>
      <g class="legL"><rect x="0" y="20" width="4" height="10" fill="#3a3b92"/><rect x="0" y="30" width="4" height="2" fill="#4a4a4a"/></g>
      <g class="legR"><rect x="4" y="20" width="4" height="10" fill="#2e2f78"/><rect x="4" y="30" width="4" height="2" fill="#4a4a4a"/></g>
      <rect x="0" y="8" width="8" height="12" fill="#28a7a0"/>
      <g class="armL"><rect x="-4" y="8" width="4" height="4" fill="#28a7a0"/><rect x="-4" y="12" width="4" height="8" fill="#c68a5e"/></g>
      <g class="armR"><rect x="8" y="8" width="4" height="4" fill="#28a7a0"/><rect x="8" y="12" width="4" height="8" fill="#c68a5e"/></g>
      <rect x="0" y="0" width="8" height="8" fill="#c68a5e"/>
      <rect x="0" y="0" width="8" height="3" fill="#3b2a1a"/><rect x="0" y="3" width="1" height="1" fill="#3b2a1a"/><rect x="7" y="3" width="1" height="1" fill="#3b2a1a"/>
      <rect x="1" y="4" width="2" height="1" fill="#fff"/><rect x="5" y="4" width="2" height="1" fill="#fff"/>
      <rect x="2" y="4" width="1" height="1" fill="#3a3aa0"/><rect x="5" y="4" width="1" height="1" fill="#3a3aa0"/>
      <rect x="3" y="6" width="2" height="1" fill="#8a4b3a"/>
    </g>
  </g>
</svg>

<section class="card" id="card" aria-live="polite">
  <div id="climbing">
    <p class="label">Climbing Kilimanjaro</p>
    <p class="alt" id="alt">1,640 m</p>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <div id="ask" hidden>
    <h1>Will you be my boyfriend?</h1>
    <p class="sub" id="sub">I climbed 5,895 m to ask.</p>
    <div class="btns"><button id="yes" type="button">Yes</button><button id="no" type="button">No</button></div>
  </div>
  <div id="done" hidden>
    <h1>You said yes!</h1>
    <p class="sub">Best summit of my life.</p>
    <div class="btns"><button id="again" type="button">Retry</button></div>
  </div>
</section>
</main>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var C=200,TOP=260,BASE=660;
  var half=function(y){return 50+(y-TOP)*0.5};
  var $=function(id){return document.getElementById(id)};

  // stars
  var s='';[[20,20],[80,60],[140,30],[260,50],[330,24],[370,90],[200,100],[50,130],[300,120]].forEach(function(p){s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="4" height="4"/>'});
  $('stars').innerHTML=s;

  // pixel mountain, built from 10px blocks banded by altitude
  var bands=[[300,'#f2f6ff','#dde7f7'],[370,'#8c8798','#7b7686'],[450,'#9a8a52','#8a7b47'],[550,'#2f7a40','#286b37'],[9999,'#6aa83e','#5f9a38']];
  var m='';
  for(var x=0;x<400;x+=10){
    var dx=Math.abs(x+5-C);
    var t=dx<=50?TOP:TOP+(dx-50)*2;
    t=Math.round(t/10)*10;
    for(var y=t;y<700;y+=10){
      var b=bands.find(function(b){return y<b[0]});
      m+='<rect x="'+x+'" y="'+y+'" width="10" height="10" fill="'+(((x+y)/10)%2?b[1]:b[2])+'"/>';
    }
  }
  $('mtn').innerHTML=m;

  // switchback trail
  var ys=[650,590,530,470,410,350,300],pts=[];
  ys.forEach(function(y,i){
    var off=half(y)-25;
    var px=i%2===0?C-off:C+off;
    pts.push([Math.max(20,Math.min(380,px)),y]);
  });
  pts.push([C,TOP+2]);
  var d='M'+pts.map(function(p){return p[0]+' '+p[1]}).join(' L');
  var trail=$('trail');trail.setAttribute('d',d);
  var L=trail.getTotalLength();

  // pixel heart above the head
  var hg=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],h='';
  hg.forEach(function(r,j){r.split('').forEach(function(c,i){if(c==='X')h+='<rect x="'+(i+.5)+'" y="'+(j-9)+'" width="1" height="1"/>'})});
  $('heart').innerHTML=h;

  var hero=$('hero'),dir=1;
  function place(p,dr){hero.setAttribute('transform','translate('+p.x+','+p.y+') scale('+(dr*1.5)+',1.5) translate(-4,-32)')}

  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR=reduce?0:10000,start=null,last=null;
  function showAsk(){
    $('climbing').hidden=true;
    $('ask').hidden=false;$('ask').classList.add('reveal');
    hero.classList.remove('walking');
    place(trail.getPointAtLength(L),1);
    $('yes').focus({preventScroll:true});
  }
  function step(ts){
    if(start===null)start=ts;
    var t=DUR?Math.min((ts-start)/DUR,1):1;
    var p=trail.getPointAtLength(L*t);
    if(last&&Math.abs(p.x-last.x)>.05)dir=p.x>last.x?1:-1;
    last=p;
    place(p,dir);
    var alt=Math.round(1640+t*(5895-1640));
    $('alt').textContent=alt.toLocaleString('en-US')+' m';
    $('fill').style.width=(t*100)+'%';
    if(t<1)requestAnimationFrame(step);else showAsk();
  }
  function begin(){
    start=null;last=null;dir=1;
    hero.classList.add('walking');
    place(trail.getPointAtLength(0),1);
    setTimeout(function(){requestAnimationFrame(step)},500);
  }
  begin();

  // "No" gets smaller, "Yes" gets bigger
  var msgs=['Are you sure?','Really sure?','Look at that view.','I carried snacks up here.','Last chance, I promise.'];
  var n=0,yes=$('yes'),no=$('no');
  no.addEventListener('click',function(){
    n++;
    $('sub').textContent=msgs[Math.min(n-1,msgs.length-1)];
    yes.style.transform='scale('+Math.min(1+n*.12,1.6)+')';
    no.style.transform='scale('+Math.max(1-n*.14,.3)+')';
    if(n>=6)no.hidden=true;
  });

  yes.addEventListener('click',function(){
    $('ask').hidden=true;
    $('done').hidden=false;$('done').classList.add('reveal');
    $('heart').setAttribute('display','inline');
    hero.classList.add('cheer');
    if(reduce)return;
    for(var i=0;i<30;i++){
      (function(i){setTimeout(function(){
        var e=document.createElement('span');
        e.className='heart';e.textContent='\u2665';
        e.style.left=Math.random()*100+'vw';
        e.style.fontSize=(18+Math.random()*30)+'px';
        e.style.animationDuration=(3+Math.random()*3)+'s';
        e.addEventListener('animationend',function(){e.remove()});
        document.body.appendChild(e);
      },i*120)})(i);
    }
  });

  // Retry: reset everything and climb again
  $('again').addEventListener('click',function(){
    n=0;
    yes.style.transform='';no.style.transform='';no.hidden=false;
    $('sub').textContent='I climbed 5,895 m to ask.';
    $('done').hidden=true;$('ask').hidden=true;$('climbing').hidden=false;
    $('alt').textContent='1,640 m';$('fill').style.width='0%';
    $('heart').setAttribute('display','none');
    hero.classList.remove('cheer');
    document.querySelectorAll('.heart').forEach(function(e){e.remove()});
    begin();
  });
})();
</script>
</body>
</html>
